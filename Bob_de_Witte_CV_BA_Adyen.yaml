design:
  theme: classic

  page:
    size: a4
    top_margin: 0.35in
    bottom_margin: 0.35in
    left_margin: 0.35in
    right_margin: 0.35in
    show_footer: false
    show_top_note: false

  colors:
    headline: rgb(0, 0, 0)
    links: rgb(0, 0, 0)

  links:
    underline: true
    show_external_link_icon: false

  header:
    connections:
      phone_number_format: international

  typography:
    line_spacing: 0.4em
    alignment: justified
    font_family:
      body: Source Sans 3
      name: Source Sans 3
      headline: Source Sans 3
      connections: Source Sans 3
    font_size:
      body: 9pt
      name: 26pt
      headline: 8pt
      connections: 9pt

  section_titles:
    type: with_partial_line
    line_thickness: 0.5pt
    space_above: 0.4cm
    space_below: 0.15cm

  # top-level section settings
  sections:
    allow_page_break: true
    space_between_regular_entries: 0.8em
    space_between_text_based_entries: 0.15em
    show_time_spans_in:
      - experience

  entries:
    date_and_location_width: 4.0cm
    side_space: 0.15cm
    space_between_columns: 0.08cm
    allow_page_break: true
    short_second_row: true
    summary:
      space_above: 0cm
      space_left: 0cm
    highlights:
      bullet: •
      nested_bullet: •
      space_left: 0.12cm
      space_above: 0cm
      space_between_items: 0cm
      space_between_bullet_and_text: 0.4em
settings:
  current_date: today
  render_command:
    output_folder: rendercv_output
    typst_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.typ
    pdf_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.pdf
    markdown_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.md
    html_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.html
    png_path: OUTPUT_FOLDER/NAME_IN_SNAKE_CASE_CV.png
    dont_generate_markdown: false
    dont_generate_html: false
    dont_generate_typst: false
    dont_generate_pdf: false
    dont_generate_png: false
  pdf_title: NAME - CV
